---
dontChroot: false
timeout: 999
script:
    - "rm -f /var/lib/pacman/db.lck"
    - "rm -rf /etc/pacman.d/gnupg"
    - "rm -f /etc/resolv.conf"
    - "echo 'nameserver 8.8.8.8' > /etc/resolv.conf"
    - "pacman-key --init"
    - "pacman-key --populate archlinux"
    - "pacman-key --populate lumina"
    - "pacman-key --lsign-key 093B74E82FCA45014329D8B1FE2080D27FBE66D8"
    - "rm -f /etc/mkinitcpio.conf.d/archiso.conf"
    - "rm -f /etc/mkinitcpio.d/linux.preset"
    - "pacman -Sy --noconfirm linux"
    - "pacman -Sy --noconfirm --overwrite='/etc/pacman.d/mirrorlist.lumina,/etc/pacman.conf' linux lumina-system-config"
