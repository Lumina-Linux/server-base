---
# Activar servicios críticos en el sistema recién instalado
units:
  # La red (Opcional en la instalación, por eso mandatory: false)
  - name: "NetworkManager.service"
    action: "enable"
    mandatory: false

  # Sincronización de hora por red (Siempre útil en servidores)
  - name: "systemd-timesyncd.service"
    action: "enable"
    mandatory: false

  # ¡Nuestro flamante limpiador de SSDs en segundo plano!
  - name: "fstrim.timer"
    action: "enable"
    mandatory: false

  # Servicio de configuración de Snapper (bomba de tiempo única)
  - name: "lumina-postinstall.service"
    action: "enable"
    mandatory: false

 # El servidor de SSH para la administración remota
  - name: "sshd.service"
    action: "enable"
    mandatory: false

  # Servicio para agregar entradas de snapshot a grub
  - name: "grub-btrfsd.service"
    action: "enable"
    mandatory: false
