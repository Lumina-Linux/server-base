---
groupsUrl: local
groups:
  # --- GROUP 1: KERNEL (Critical) ---
  - name: "Select System Kernel"
    description: "Select the base kernel for the server. This is mandatory."
    hidden: false
    selected: true
    critical: true
    subgroups:
      - name: "Kernel LTS (Stable)"
        description: "Recommended for servers. Long-term support and maximum stability."
        selected: true
        packages:
          - linux-lts
          - linux-lts-headers
      - name: "Kernel Hardened (Advanced Security)"
        description: "Hardened kernel with exploit mitigation patches. Ideal for nodes exposed to the internet."
        selected: false
        packages:
          - linux-hardened
          - linux-hardened-headers

  # --- GROUP 2: NETWORK AND BASE SECURITY ---
  - name: "Network Configuration & Security"
    description: "Essential services to bring up connectivity and protect server ports."
    hidden: false
    selected: true
    critical: true
    subgroups:
      - name: "NetworkManager Stack"
        description: "Full and recommended network manager. Includes nmcli and nmtui interactive utilities."
        selected: true
        packages:
          - networkmanager
      - name: "OpenSSH Secure Shell"
        description: "Secure SSH server for administration and remote access. Essential for any server."
        selected: true
        packages:
          - openssh
      - name: "UFW (Uncomplicated Firewall)"
        description: "Simple and quick to configure firewall. Ideal for closing ports immediately."
        selected: false
        packages:
          - ufw
      - name: "Firewalld (Zone-Based Management)"
        description: "Enterprise-grade dynamic firewall. Excellent for multiple interfaces, bridges, or subnets."
        selected: false
        packages:
          - firewalld

