      - name: "Dnsmasq (Lightweight DNS & DHCP)"
        description: "Ultra-lightweight integrated server. Perfect for local DNS resolution and fast DHCP in small environments."
        selected: false
        packages:
          - dnsmasq
      - name: "BIND9 (Enterprise DNS Server)"
        description: "The de facto standard for robust, native domain name servers with advanced zones."
        selected: false
        packages:
          - bind
      - name: "Kea DHCP Server"
        description: "Modern, high-performance DHCP engine developed by ISC, modular and with DB storage support."
        selected: false
        packages:
          - kea
      - name: "OpenLDAP (Directory Service)"
        description: "Free and open-source LDAP implementation for centralized account management and authentication."
        selected: false
        packages:
          - openldap

