LABEL arch_nbd
TEXT HELP
Boot the Lumina Linux Server install medium using NBD.
It allows you to install Lumina Linux Server or perform system maintenance.
ENDTEXT
MENU LABEL Lumina Linux Server install medium (%ARCH%, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cms_verify=y
SYSAPPEND 3

